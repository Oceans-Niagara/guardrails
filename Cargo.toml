[package]
name = "guardrails"
version = "0.1.3"
edition = "2021"
license = "LicenseRef-Proprietary"

[dependencies]
globset = "0.4"
anyhow = "1"
ast-grep-core = "0.51"
ast-grep-language = "0.51"
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-compact = "2.1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
ignore = "0.4"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true