name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: guardrails-linux-x86_64
            bin: guardrails
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: guardrails-macos-arm64
            bin: guardrails
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: guardrails-macos-x86_64
            bin: guardrails
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: guardrails-windows-x86_64.exe
            bin: guardrails.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.asset_name }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
